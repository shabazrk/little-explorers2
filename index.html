<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Bumble's Silly Potion Cafe</title>
  <meta name="description" content="A character-driven children's educational cooking & potion game with hilarious physical comedy, real fluid mixing, and stealth learning.">
  <meta name="theme-color" content="#fdfbf7" id="meta-theme-color">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧪</text></svg>">

  <style>
    :root {
      --bg-cream: #fdfbf7;
      --bg-cafe: #f5eedc;
      --wood-dark: #78350f;
      --wood-mid: #b45309;
      --wood-light: #fde68a;
      --monster-purple: #9333ea;
      --monster-belly: #fef08a;
      --potion-color: #fef3c7;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      background: var(--bg-cream);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Rounded", "Comic Neue", "Nunito", sans-serif;
      touch-action: manipulation;
    }

    #app {
      width: 100%;
      height: 100%;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      position: relative;
      background:
        radial-gradient(circle at 50% 10%, #fef3c7 0%, transparent 45%),
        radial-gradient(circle at 10% 90%, #ede9fe 0%, transparent 40%),
        radial-gradient(circle at 90% 90%, #fef2f2 0%, transparent 40%),
        var(--bg-cream);
      padding: calc(var(--safe-top) + 8px) 12px calc(var(--safe-bottom) + 8px);
    }

    /* TOP HEADER & ORDERS BAR */
    .cafe-top-bar {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      z-index: 50;
      flex-shrink: 0;
    }

    .cafe-header-row {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 4px;
    }

    .cafe-title {
      font-size: 1.25rem;
      font-weight: 900;
      color: var(--wood-dark);
      display: flex;
      align-items: center;
      gap: 6px;
      letter-spacing: -0.02em;
    }

    .cafe-icon-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: 1.5px solid rgba(120, 53, 15, 0.18);
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.06);
      transition: transform 0.15s ease;
    }
    .cafe-icon-btn:active { transform: scale(0.9); }
    .cafe-icon-btn svg { width: 20px; height: 20px; fill: none; stroke: var(--wood-dark); stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }

    /* ORDER RECIPE TABS */
    .orders-scroll-bar {
      display: flex;
      align-items: center;
      gap: 6px;
      overflow-x: auto;
      max-width: 100%;
      padding: 2px 4px;
      scrollbar-width: none;
    }
    .orders-scroll-bar::-webkit-scrollbar { display: none; }

    .order-pill {
      border: 2px solid #e7ded0;
      background: rgba(255, 255, 255, 0.9);
      padding: 5px 12px;
      border-radius: 9999px;
      font-size: 0.82rem;
      font-weight: 800;
      color: var(--wood-dark);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.04);
      transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .order-pill.active {
      background: #f59e0b;
      color: #ffffff;
      border-color: #d97706;
      box-shadow: 0 3px 12px rgba(245, 158, 11, 0.4);
      transform: scale(1.05);
    }

    /* MAIN STAGE (BUMBLE & CAULDRON) */
    .cafe-main-stage {
      flex: 1;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      position: relative;
      overflow: hidden;
      margin: 4px 0;
    }

    /* BUMBLE CHARACTER AREA */
    .bumble-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
      position: relative;
      z-index: 20;
      transform-origin: center bottom;
      transition: transform 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .bumble-container:hover { transform: scale(1.03); }

    .bumble-svg {
      width: clamp(140px, 32vw, 175px);
      height: clamp(130px, 30vw, 165px);
      filter: drop-shadow(0 10px 20px rgba(126, 34, 206, 0.25));
    }

    /* BUMBLE SPEECH BUBBLE */
    .bumble-speech {
      background: rgba(255, 255, 255, 0.96);
      padding: 6px 16px;
      border-radius: 20px;
      border: 2px solid #ddd6fe;
      box-shadow: 0 4px 16px rgba(126, 34, 206, 0.12);
      font-size: 0.88rem;
      font-weight: 800;
      color: #581c87;
      text-align: center;
      max-width: 280px;
      margin-top: -6px;
      position: relative;
      z-index: 25;
      animation: popIn 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    /* CAULDRON STATION */
    .cauldron-station {
      position: relative;
      width: clamp(230px, 60vw, 300px);
      height: clamp(160px, 38vw, 195px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      z-index: 10;
    }

    .cauldron-svg {
      width: 100%;
      height: 100%;
      filter: drop-shadow(0 8px 24px rgba(69, 26, 3, 0.35));
    }

    /* LIQUID SURFACE INSIDE CAULDRON */
    .cauldron-liquid {
      transition: fill 0.5s ease;
    }

    .cauldron-bubbles {
      position: absolute;
      top: 35px;
      left: 50%;
      transform: translateX(-50%);
      width: 180px;
      height: 40px;
      pointer-events: none;
      overflow: visible;
    }

    .liquid-bubble {
      position: absolute;
      background: rgba(255, 255, 255, 0.65);
      border-radius: 50%;
      animation: bubbleRise 1.4s ease-in-out infinite;
    }

    @keyframes bubbleRise {
      0% { transform: translateY(0) scale(0.6); opacity: 0.3; }
      50% { opacity: 0.9; }
      100% { transform: translateY(-45px) scale(1.3); opacity: 0; }
    }

    /* IN-POT INGREDIENT ICONS */
    .pot-contents-tag {
      position: absolute;
      bottom: 22px;
      background: rgba(255, 255, 255, 0.94);
      padding: 3px 12px;
      border-radius: 9999px;
      border: 1.5px solid #d97706;
      font-size: 0.82rem;
      font-weight: 900;
      color: #92400e;
      display: flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.1);
      z-index: 30;
      max-width: 90%;
      overflow: hidden;
      white-space: nowrap;
    }

    /* SERVE POTION FLOATING BUTTON */
    .serve-potion-btn {
      position: absolute;
      top: -12px;
      right: -10px;
      background: linear-gradient(135deg, #f59e0b 0%, #ea580c 100%);
      color: #ffffff;
      border: 3px solid #ffffff;
      padding: 8px 16px;
      border-radius: 9999px;
      font-size: 0.92rem;
      font-weight: 900;
      display: none;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      box-shadow: 0 8px 24px rgba(234, 88, 12, 0.5);
      z-index: 40;
      animation: pulseServe 1.2s infinite alternate ease-in-out;
    }
    @keyframes pulseServe {
      0% { transform: scale(1); }
      100% { transform: scale(1.08) translateY(-3px); }
    }
    .serve-potion-btn:active { transform: scale(0.92); }

    /* PANTRY INGREDIENT SHELF (BOTTOM TRAY) */
    .pantry-shelf {
      width: 100%;
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 2px solid #e7ded0;
      border-radius: 28px;
      padding: 10px 8px;
      display: flex;
      justify-content: space-around;
      align-items: center;
      box-shadow: 0 6px 20px rgba(120, 53, 15, 0.08);
      z-index: 45;
      flex-shrink: 0;
    }

    .ingredient-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: grab;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      padding: 4px;
    }
    .ingredient-item:hover { transform: scale(1.15) translateY(-3px); }
    .ingredient-item:active { cursor: grabbing; transform: scale(1.25); }

    .ingredient-svg {
      width: 48px;
      height: 48px;
      filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.15));
    }
    .ingredient-label {
      font-size: 0.72rem;
      font-weight: 800;
      color: var(--wood-dark);
      margin-top: 2px;
    }

    /* REACTION ANIMATIONS FOR BUMBLE */
    .anim-spicy {
      animation: spicyFever 0.6s ease-in-out infinite alternate;
    }
    @keyframes spicyFever {
      0% { transform: scale(1) rotate(-4deg); }
      100% { transform: scale(1.12) rotate(4deg); }
    }

    .anim-sour {
      animation: sourPucker 0.5s ease-in-out;
    }
    @keyframes sourPucker {
      0% { transform: scale(1); }
      40% { transform: scale(0.65, 0.7) rotate(6deg); }
      70% { transform: scale(0.75, 0.65) rotate(-6deg); }
      100% { transform: scale(1); }
    }

    .anim-bouncy {
      animation: bouncyMonster 0.7s cubic-bezier(0.175, 0.885, 0.32, 1.275) 3;
    }
    @keyframes bouncyMonster {
      0%, 100% { transform: translateY(0) scale(1, 1); }
      40% { transform: translateY(-70px) scale(0.9, 1.15); }
      60% { transform: translateY(0) scale(1.25, 0.75); }
    }

    .anim-frozen {
      animation: frozenShake 0.4s ease-in-out;
    }
    @keyframes frozenShake {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-8px) rotate(-3deg); }
      40% { transform: translateX(8px) rotate(3deg); }
      60% { transform: translateX(-5px); }
      80% { transform: translateX(5px); }
    }

    .anim-tickle {
      animation: tickleWobble 0.45s ease-in-out;
    }
    @keyframes tickleWobble {
      0%, 100% { transform: scale(1) rotate(0deg); }
      25% { transform: scale(1.1) rotate(-8deg); }
      75% { transform: scale(1.1) rotate(8deg); }
    }

    /* STEAM & CONFETTI OVERLAYS */
    #fx-overlay {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 100;
      overflow: hidden;
    }

    .confetti-piece {
      position: absolute;
      top: -20px;
      animation: confettiFall 2.5s linear forwards;
    }
    @keyframes confettiFall {
      0% { transform: translateY(0) rotate(0deg); opacity: 1; }
      100% { transform: translateY(105vh) rotate(720deg); opacity: 0; }
    }

    /* POP IN HELPER */
    .pop-in {
      animation: popIn 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }
    @keyframes popIn {
      0% { transform: scale(0.4); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
  </style>
</head>
<body>

  <div id="app">
    <!-- TOP HEADER & CAFE ORDERS -->
    <header class="cafe-top-bar">
      <div class="cafe-header-row">
        <h1 class="cafe-title">
          <span>🧪</span>
          <span>Bumble's Potion Cafe</span>
        </h1>
        <button class="cafe-icon-btn" onclick="clearCauldron()" title="Empty Pot" aria-label="Empty Pot">
          <svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><polyline points="3 3 3 8 8 8"/></svg>
        </button>
      </div>

      <!-- RECIPE ORDERS ROW -->
      <nav class="orders-scroll-bar" aria-label="Potion Orders">
        <button id="order-tab-1" class="order-pill active" onclick="setOrder(1)">🍇 Purple Fizz (1+1)</button>
        <button id="order-tab-2" class="order-pill" onclick="setOrder(2)">🌶️ Dragon Fire (2+1)</button>
        <button id="order-tab-3" class="order-pill" onclick="setOrder(3)">🍋 Sour Sunset (1+1+1)</button>
        <button id="order-tab-0" class="order-pill" onclick="setOrder(0)">✨ Chef's Choice</button>
      </nav>
    </header>

    <!-- MAIN CAFE STAGE (BUMBLE & CAULDRON) -->
    <main class="cafe-main-stage">
      
      <!-- BUMBLE THE HUNGRY MONSTER -->
      <div id="bumble" class="bumble-container" onclick="tickleBumble()" title="Tap Bumble to tickle!">
        <svg id="bumble-svg" viewBox="0 0 180 170" class="bumble-svg">
          <defs>
            <!-- Normal Monster Purple Gradient -->
            <radialGradient id="bumbleSkinGrad" cx="40%" cy="35%" r="65%">
              <stop offset="0%" stop-color="#c084fc"/>
              <stop offset="55%" stop-color="#9333ea"/>
              <stop offset="90%" stop-color="#7e22ce"/>
              <stop offset="100%" stop-color="#581c87"/>
            </radialGradient>
            <!-- Spicy Fiery Skin Gradient -->
            <radialGradient id="spicySkinGrad" cx="40%" cy="35%" r="65%">
              <stop offset="0%" stop-color="#f87171"/>
              <stop offset="60%" stop-color="#dc2626"/>
              <stop offset="100%" stop-color="#991b1b"/>
            </radialGradient>
            <!-- Frozen Ice Skin Gradient -->
            <radialGradient id="frozenSkinGrad" cx="40%" cy="35%" r="65%">
              <stop offset="0%" stop-color="#bae6fd"/>
              <stop offset="60%" stop-color="#38bdf8"/>
              <stop offset="100%" stop-color="#0284c7"/>
            </radialGradient>
          </defs>

          <!-- Little Monster Horns / Ears -->
          <path id="bumble-horn-left" d="M42 45 C32 18 20 28 32 40" fill="#facc15" stroke="#ca8a04" stroke-width="2.5" stroke-linecap="round"/>
          <path id="bumble-horn-right" d="M138 45 C148 18 160 28 148 40" fill="#facc15" stroke="#ca8a04" stroke-width="2.5" stroke-linecap="round"/>

          <!-- Monster Chubby Body -->
          <ellipse id="bumble-body" cx="90" cy="98" rx="58" ry="52" fill="url(#bumbleSkinGrad)" stroke="#581c87" stroke-width="3.5"/>

          <!-- Monster Soft Belly -->
          <ellipse id="bumble-belly" cx="90" cy="115" rx="36" ry="30" fill="#fef08a" stroke="#eab308" stroke-width="2"/>

          <!-- Eyes with Tracking Pupils -->
          <g id="bumble-eyes">
            <!-- Left Eye -->
            <circle cx="68" cy="68" r="14" fill="#ffffff" stroke="#581c87" stroke-width="2.5"/>
            <circle id="bumble-pupil-left" cx="68" cy="68" r="7" fill="#1e1b4b"/>
            <circle cx="70" cy="65" r="2.5" fill="#ffffff"/>

            <!-- Right Eye -->
            <circle cx="112" cy="68" r="14" fill="#ffffff" stroke="#581c87" stroke-width="2.5"/>
            <circle id="bumble-pupil-right" cx="112" cy="68" r="7" fill="#1e1b4b"/>
            <circle cx="114" cy="65" r="2.5" fill="#ffffff"/>
          </g>

          <!-- Rosy Monster Cheeks -->
          <circle id="bumble-cheek-l" cx="50" cy="85" r="8" fill="#f43f5e" opacity="0.45"/>
          <circle id="bumble-cheek-r" cx="130" cy="85" r="8" fill="#f43f5e" opacity="0.45"/>

          <!-- Snout / Nose -->
          <ellipse cx="90" cy="82" rx="7" ry="5" fill="#581c87"/>

          <!-- Mouth States -->
          <!-- Default Smiling Mouth -->
          <path id="mouth-default" d="M78 94 Q90 106 102 94" stroke="#581c87" stroke-width="3.5" stroke-linecap="round" fill="none"/>
          
          <!-- Open Hungry/Drinking Mouth -->
          <g id="mouth-open" style="display:none;">
            <ellipse cx="90" cy="98" rx="14" ry="16" fill="#4c0519" stroke="#581c87" stroke-width="2.5"/>
            <path d="M82 106 Q90 114 98 106" fill="#f43f5e"/>
            <polygon points="86,85 89,90 83,90" fill="#ffffff"/>
          </g>

          <!-- Sour Puckered Mouth -->
          <g id="mouth-sour" style="display:none;">
            <ellipse cx="90" cy="94" rx="5" ry="6" fill="#4c0519" stroke="#581c87" stroke-width="2"/>
            <path d="M82 92 Q90 88 98 92" stroke="#581c87" stroke-width="2" fill="none"/>
          </g>

          <!-- Chef Party Hat (Unlocked on order complete) -->
          <g id="bumble-chef-hat" style="display:none;" class="pop-in">
            <path d="M72 32 C62 10 118 10 108 32 Z" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
            <rect x="70" y="30" width="40" height="10" rx="3" fill="#facc15" stroke="#ca8a04" stroke-width="1.5"/>
            <circle cx="90" cy="15" r="14" fill="#ffffff"/>
          </g>
        </svg>

        <!-- Dynamic Speech Bubble -->
        <div id="speech-bubble" class="bumble-speech">
          "Me so hungry! Can you brew me a PURPLE FIZZ potion?" 🍇✨
        </div>
      </div>

      <!-- THE BUBBLING CAULDRON STATION -->
      <div id="cauldron-station" class="cauldron-station">
        <!-- Serve Potion Button (Pulses when 1+ ingredients added) -->
        <button id="serve-btn" class="serve-potion-btn" onclick="feedBumble()" title="Feed to Bumble!">
          <span>🥣</span>
          <span>Feed Bumble!</span>
        </button>

        <!-- Cauldron SVG Graphic -->
        <svg viewBox="0 0 280 180" class="cauldron-svg">
          <defs>
            <radialGradient id="cauldronIron" cx="45%" cy="35%" r="65%">
              <stop offset="0%" stop-color="#475569"/>
              <stop offset="50%" stop-color="#334155"/>
              <stop offset="90%" stop-color="#1e293b"/>
              <stop offset="100%" stop-color="#0f172a"/>
            </radialGradient>
            <linearGradient id="goldRim" x1="0%" y1="0%" x2="100%" y2="0%">
              <stop offset="0%" stop-color="#d97706"/>
              <stop offset="50%" stop-color="#fbbf24"/>
              <stop offset="100%" stop-color="#b45309"/>
            </linearGradient>
            <!-- Liquid Surface Gradient -->
            <radialGradient id="liquidGrad" cx="50%" cy="40%" r="60%">
              <stop id="liquid-core" offset="0%" stop-color="#fef08a"/>
              <stop id="liquid-mid" offset="70%" stop-color="#fde047"/>
              <stop id="liquid-dark" offset="100%" stop-color="#eab308"/>
            </radialGradient>
          </defs>

          <!-- Glowing Fire Embers Underneath -->
          <ellipse cx="140" cy="172" rx="72" ry="10" fill="#ea580c" opacity="0.6"/>
          <ellipse cx="140" cy="172" rx="42" ry="6" fill="#facc15" opacity="0.8"/>

          <!-- Iron Cauldron Legs -->
          <path d="M65 145 L45 174 L60 174 Z" fill="#1e293b"/>
          <path d="M215 145 L235 174 L220 174 Z" fill="#1e293b"/>

          <!-- Pot Belly -->
          <ellipse cx="140" cy="115" rx="100" ry="58" fill="url(#cauldronIron)" stroke="#0f172a" stroke-width="4"/>

          <!-- Glowing Potion Liquid Surface -->
          <ellipse id="cauldron-liquid-surface" class="cauldron-liquid" cx="140" cy="72" rx="78" ry="24" fill="url(#liquidGrad)"/>

          <!-- Cauldron Outer Rim -->
          <ellipse cx="140" cy="70" rx="86" ry="26" fill="none" stroke="url(#goldRim)" stroke-width="7"/>
          <ellipse cx="140" cy="70" rx="86" ry="26" fill="none" stroke="#78350f" stroke-width="1.5"/>

          <!-- Side Ring Handles -->
          <circle cx="44" cy="95" r="10" fill="none" stroke="#d97706" stroke-width="4"/>
          <circle cx="236" cy="95" r="10" fill="none" stroke="#d97706" stroke-width="4"/>
        </svg>

        <!-- Rising Bubbles in Cauldron -->
        <div id="cauldron-bubbles" class="cauldron-bubbles">
          <div class="liquid-bubble" style="left:25px; width:12px; height:12px; animation-delay:0.1s;"></div>
          <div class="liquid-bubble" style="left:60px; width:18px; height:18px; animation-delay:0.5s;"></div>
          <div class="liquid-bubble" style="left:100px; width:14px; height:14px; animation-delay:0.9s;"></div>
          <div class="liquid-bubble" style="left:145px; width:16px; height:16px; animation-delay:0.3s;"></div>
        </div>

        <!-- In-Pot Ingredients Label Tag -->
        <div id="pot-contents-tag" class="pot-contents-tag">
          <span>Pot is Empty</span>
        </div>
      </div>

    </main>

    <!-- INGREDIENT PANTRY SHELF (BOTTOM TRAY) -->
    <footer class="pantry-shelf" aria-label="Ingredients Pantry">
      
      <!-- 1. Ruby Berry -->
      <div id="ing-berry" class="ingredient-item" onclick="addIngredient('berry')" title="Add Ruby Berry">
        <svg viewBox="0 0 60 60" class="ingredient-svg">
          <path d="M30 12 C24 4 18 10 26 15 C18 18 22 24 28 18 C30 25 36 24 33 18 C39 22 43 16 35 15 C41 11 36 5 30 12 Z" fill="#22c55e"/>
          <circle cx="30" cy="13" r="2.5" fill="#15803d"/>
          <path d="M30 15 C18 15 12 25 14 38 C16 48 24 55 30 57 C36 55 44 48 46 38 C48 25 42 15 30 15 Z" fill="#e11d48" stroke="#991b1b" stroke-width="2"/>
          <ellipse cx="23" cy="26" rx="6" ry="11" fill="rgba(255,255,255,0.75)" transform="rotate(-25 23 26)"/>
        </svg>
        <span class="ingredient-label">Berry 🍓</span>
      </div>

      <!-- 2. Sky Blueberry -->
      <div id="ing-blueberry" class="ingredient-item" onclick="addIngredient('blueberry')" title="Add Blueberry">
        <svg viewBox="0 0 60 60" class="ingredient-svg">
          <circle cx="30" cy="34" r="22" fill="#3b82f6" stroke="#1d4ed8" stroke-width="2"/>
          <path d="M26 12 L34 12 L30 18 Z" fill="#1e3a8a"/>
          <circle cx="30" cy="14" r="5" fill="#1e40af"/>
          <ellipse cx="22" cy="25" rx="5" ry="9" fill="rgba(255,255,255,0.7)" transform="rotate(-25 22 25)"/>
        </svg>
        <span class="ingredient-label">Blue 🫐</span>
      </div>

      <!-- 3. Sour Lemon -->
      <div id="ing-lemon" class="ingredient-item" onclick="addIngredient('lemon')" title="Add Sour Lemon">
        <svg viewBox="0 0 60 60" class="ingredient-svg">
          <ellipse cx="30" cy="32" rx="22" ry="17" fill="#facc15" stroke="#ca8a04" stroke-width="2" transform="rotate(-20 30 32)"/>
          <path d="M8 22 Q12 18 16 24 Z" fill="#eab308"/>
          <path d="M52 42 Q48 46 44 40 Z" fill="#eab308"/>
          <ellipse cx="24" cy="24" rx="4" ry="8" fill="rgba(255,255,255,0.7)" transform="rotate(-30 24 24)"/>
        </svg>
        <span class="ingredient-label">Lemon 🍋</span>
      </div>

      <!-- 4. Dragon Chili -->
      <div id="ing-chili" class="ingredient-item" onclick="addIngredient('chili')" title="Add Dragon Chili">
        <svg viewBox="0 0 60 60" class="ingredient-svg">
          <path d="M36 12 C34 6 28 8 28 14" stroke="#15803d" stroke-width="3" fill="none" stroke-linecap="round"/>
          <path d="M26 14 C18 16 14 26 22 36 C30 46 38 52 46 54 C48 54 46 50 42 44 C36 34 36 20 26 14 Z" fill="#ef4444" stroke="#b91c1c" stroke-width="2"/>
          <path d="M24 22 C22 28 26 36 32 42" stroke="rgba(255,255,255,0.55)" stroke-width="2" fill="none" stroke-linecap="round"/>
        </svg>
        <span class="ingredient-label">Chili 🌶️</span>
      </div>

      <!-- 5. Star Ice Cube -->
      <div id="ing-ice" class="ingredient-item" onclick="addIngredient('ice')" title="Add Star Ice">
        <svg viewBox="0 0 60 60" class="ingredient-svg">
          <rect x="12" y="14" width="36" height="36" rx="8" fill="#38bdf8" stroke="#0284c7" stroke-width="2"/>
          <path d="M12 24 L48 24 M24 14 L24 50" stroke="rgba(255,255,255,0.6)" stroke-width="2"/>
          <polygon points="30,22 32,27 38,27 33,31 35,36 30,33 25,36 27,31 22,27 28,27" fill="#ffffff"/>
        </svg>
        <span class="ingredient-label">Ice 🧊</span>
      </div>

    </footer>

    <!-- FX OVERLAYS (CONFETTI, STEAM) -->
    <div id="fx-overlay"></div>
  </div>

  <script>
    // --- WEB AUDIO API PROCEDURAL CARTOON FOLEY ---
    let audioCtx = null;
    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function playNote(freq, dur = 0.3, type = 'sine') {
      initAudio();
      if (!audioCtx) return;
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + dur);
      } catch (e) {}
    }

    function playPlop(pitch = 1.0) {
      initAudio();
      if (!audioCtx) return;
      try {
        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(320 * pitch, now);
        osc.frequency.exponentialRampToValueAtTime(740 * pitch, now + 0.08);
        gain.gain.setValueAtTime(0.26, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + 0.13);
      } catch (e) {}
    }

    function playSlurp() {
      initAudio();
      if (!audioCtx) return;
      try {
        const now = audioCtx.currentTime;
        for (let i = 0; i < 4; i++) {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(240 + Math.random() * 200, now + i * 0.07);
          osc.frequency.exponentialRampToValueAtTime(580, now + i * 0.07 + 0.06);
          gain.gain.setValueAtTime(0.2, now + i * 0.07);
          gain.gain.exponentialRampToValueAtTime(0.01, now + i * 0.07 + 0.06);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(now + i * 0.07);
          osc.stop(now + i * 0.07 + 0.07);
        }
      } catch (e) {}
    }

    function playSlideWhistle(dir = 'up') {
      initAudio();
      if (!audioCtx) return;
      try {
        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        if (dir === 'up') {
          osc.frequency.setValueAtTime(260, now);
          osc.frequency.exponentialRampToValueAtTime(840, now + 0.35);
        } else {
          osc.frequency.setValueAtTime(840, now);
          osc.frequency.exponentialRampToValueAtTime(220, now + 0.35);
        }
        gain.gain.setValueAtTime(0.24, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.36);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + 0.37);
      } catch (e) {}
    }

    function playBoing() {
      initAudio();
      if (!audioCtx) return;
      try {
        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(140, now);
        osc.frequency.linearRampToValueAtTime(460, now + 0.12);
        osc.frequency.linearRampToValueAtTime(220, now + 0.3);
        gain.gain.setValueAtTime(0.28, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.32);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + 0.33);
      } catch (e) {}
    }

    function playGiggle() {
      initAudio();
      if (!audioCtx) return;
      try {
        const now = audioCtx.currentTime;
        const giggles = [587, 659, 783, 659, 783, 880];
        giggles.forEach((freq, idx) => {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, now + idx * 0.055);
          gain.gain.setValueAtTime(0.18, now + idx * 0.055);
          gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.055 + 0.05);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(now + idx * 0.055);
          osc.stop(now + idx * 0.055 + 0.055);
        });
      } catch (e) {}
    }

    function playFanfare() {
      const melody = [523.25, 659.25, 783.99, 1046.50];
      melody.forEach((freq, idx) => {
        setTimeout(() => playNote(freq, 0.45, 'sine'), idx * 95);
      });
    }

    // --- GAME STATE & INGREDIENT RECIPES ---
    let currentOrder = 1;
    let potIngredients = [];
    const maxIngredients = 6;

    // Order definitions
    const orders = {
      1: {
        title: "Purple Fizz",
        reqs: { berry: 1, blueberry: 1 },
        prompt: "Me want PURPLE FIZZ! Add 1 Red Berry + 1 Blue Berry! 🍇✨",
        successMsg: "WOOHOO! Purple Magic! Best potion ever! 💜🎉"
      },
      2: {
        title: "Dragon Fire",
        reqs: { berry: 2, chili: 1 },
        prompt: "Make me DRAGON FIRE! Add 2 Red Berries + 1 Spicy Chili! 🌶️🔥",
        successMsg: "HOT HOT HOT! Me breathing fireflies! 🔥😂"
      },
      3: {
        title: "Sour Sunset",
        reqs: { lemon: 1, berry: 1, ice: 1 },
        prompt: "Me want SOUR SUNSET! Add 1 Lemon + 1 Berry + 1 Ice! 🍋🧊",
        successMsg: "SO SOUR & FROSTY! My face is a tiny raisin! 😜❄️"
      },
      0: {
        title: "Chef's Choice",
        reqs: null,
        prompt: "Chef's Choice! Put whatever you want in the pot! Me eat anything! 😋",
        successMsg: "YUMMM! That was a crazy delicious potion! ✨"
      }
    };

    function setOrder(orderNum) {
      initAudio();
      currentOrder = orderNum;
      document.querySelectorAll('.order-pill').forEach(btn => btn.classList.remove('active'));
      const activeTab = document.getElementById(`order-tab-${orderNum}`);
      if (activeTab) activeTab.classList.add('active');

      clearCauldron();
      document.getElementById('speech-bubble').textContent = orders[orderNum].prompt;
      playPlop(1.2);
    }

    // Add ingredient to pot
    function addIngredient(type) {
      initAudio();
      if (potIngredients.length >= maxIngredients) {
        document.getElementById('speech-bubble').textContent = "Pot is full! Tap 'Feed Bumble' to serve! 🥣";
        playBoing();
        return;
      }

      potIngredients.push(type);
      playPlop(0.85 + potIngredients.length * 0.15);

      updateLiquidColor();
      updatePotTag();

      // Show serve button
      document.getElementById('serve-btn').style.display = 'flex';

      // Open Bumble's mouth in anticipation
      const mouthOpen = document.getElementById('mouth-open');
      const mouthDefault = document.getElementById('mouth-default');
      if (mouthOpen && mouthDefault) {
        mouthOpen.style.display = 'block';
        mouthDefault.style.display = 'none';
        setTimeout(() => {
          mouthOpen.style.display = 'none';
          mouthDefault.style.display = 'block';
        }, 350);
      }
    }

    function updatePotTag() {
      const tag = document.getElementById('pot-contents-tag');
      if (potIngredients.length === 0) {
        tag.innerHTML = '<span>Pot is Empty</span>';
        document.getElementById('serve-btn').style.display = 'none';
        return;
      }

      const iconMap = {
        berry: '🍓',
        blueberry: '🫐',
        lemon: '🍋',
        chili: '🌶️',
        ice: '🧊'
      };
      const counts = {};
      potIngredients.forEach(i => counts[i] = (counts[i] || 0) + 1);

      const itemsHtml = Object.entries(counts).map(([ing, count]) => {
        return `<span>${iconMap[ing]} ${count}</span>`;
      }).join(' • ');

      tag.innerHTML = itemsHtml;
    }

    function updateLiquidColor() {
      const core = document.getElementById('liquid-core');
      const mid = document.getElementById('liquid-mid');
      const dark = document.getElementById('liquid-dark');

      const hasRed = potIngredients.includes('berry');
      const hasBlue = potIngredients.includes('blueberry');
      const hasYellow = potIngredients.includes('lemon');
      const hasChili = potIngredients.includes('chili');
      const hasIce = potIngredients.includes('ice');

      if (hasRed && hasBlue) {
        // Purple Fizz
        core.setAttribute('stop-color', '#d8b4fe');
        mid.setAttribute('stop-color', '#a855f7');
        dark.setAttribute('stop-color', '#6b21a8');
      } else if (hasChili) {
        // Spicy Fire Orange-Red
        core.setAttribute('stop-color', '#fca5a5');
        mid.setAttribute('stop-color', '#ef4444');
        dark.setAttribute('stop-color', '#991b1b');
      } else if (hasIce && hasBlue) {
        // Frosty Turquoise
        core.setAttribute('stop-color', '#a5f3fc');
        mid.setAttribute('stop-color', '#06b6d4');
        dark.setAttribute('stop-color', '#0e7490');
      } else if (hasRed && hasYellow) {
        // Citrus Orange
        core.setAttribute('stop-color', '#fed7aa');
        mid.setAttribute('stop-color', '#f97316');
        dark.setAttribute('stop-color', '#c2410c');
      } else if (hasRed) {
        // Crimson Berry
        core.setAttribute('stop-color', '#fda4af');
        mid.setAttribute('stop-color', '#f43f5e');
        dark.setAttribute('stop-color', '#be123c');
      } else if (hasBlue) {
        // Deep Indigo
        core.setAttribute('stop-color', '#93c5fd');
        mid.setAttribute('stop-color', '#3b82f6');
        dark.setAttribute('stop-color', '#1d4ed8');
      } else if (hasYellow) {
        // Zesty Yellow
        core.setAttribute('stop-color', '#fef08a');
        mid.setAttribute('stop-color', '#eab308');
        dark.setAttribute('stop-color', '#a16207');
      } else if (hasIce) {
        // Shimmering Ice
        core.setAttribute('stop-color', '#e0f2fe');
        mid.setAttribute('stop-color', '#7dd3fc');
        dark.setAttribute('stop-color', '#0284c7');
      } else {
        // Default golden broth
        core.setAttribute('stop-color', '#fef08a');
        mid.setAttribute('stop-color', '#fde047');
        dark.setAttribute('stop-color', '#eab308');
      }
    }

    function clearCauldron() {
      potIngredients = [];
      updatePotTag();
      updateLiquidColor();
      document.getElementById('serve-btn').style.display = 'none';
      playPlop(0.7);
    }

    function tickleBumble() {
      initAudio();
      playGiggle();
      const b = document.getElementById('bumble');
      b.classList.remove('anim-tickle');
      void b.offsetWidth;
      b.classList.add('anim-tickle');

      const tickleQuotes = [
        "Hehehe! That tickles my fuzzy belly! 😂",
        "Giggle giggle! You're silly, Chef! 💜",
        "Aww, tickles! Now feed me potions! 🥣"
      ];
      document.getElementById('speech-bubble').textContent = tickleQuotes[Math.floor(Math.random() * tickleQuotes.length)];
    }

    // FEED BUMBLE & TRIGGER HILARIOUS REACTION
    function feedBumble() {
      if (potIngredients.length === 0) return;
      initAudio();

      playSlurp();
      document.getElementById('serve-btn').style.display = 'none';

      // Open mouth for drinking
      const mouthOpen = document.getElementById('mouth-open');
      const mouthDefault = document.getElementById('mouth-default');
      const mouthSour = document.getElementById('mouth-sour');
      const body = document.getElementById('bumble-body');
      const bContainer = document.getElementById('bumble');

      mouthOpen.style.display = 'block';
      mouthDefault.style.display = 'none';
      mouthSour.style.display = 'none';

      setTimeout(() => {
        mouthOpen.style.display = 'none';
        mouthDefault.style.display = 'block';

        // Evaluate reaction based on ingredients
        const hasChili = potIngredients.includes('chili');
        const hasLemon = potIngredients.includes('lemon');
        const hasIce = potIngredients.includes('ice');
        const hasBerries = potIngredients.includes('berry') || potIngredients.includes('blueberry');

        // Check if matched current order
        let matchedOrder = false;
        if (currentOrder > 0) {
          const reqs = orders[currentOrder].reqs;
          const counts = {};
          potIngredients.forEach(i => counts[i] = (counts[i] || 0) + 1);
          matchedOrder = Object.entries(reqs).every(([k, v]) => counts[k] === v) &&
                         Object.keys(counts).length === Object.keys(reqs).length;
        }

        if (hasChili) {
          // SPICY FIRE REACTION
          playSlideWhistle('up');
          body.setAttribute('fill', 'url(#spicySkinGrad)');
          bContainer.classList.add('anim-spicy');
          document.getElementById('speech-bubble').textContent = "HOT HOT HOT! Me breathing blue fireflies! 🔥😂";

          setTimeout(() => {
            bContainer.classList.remove('anim-spicy');
            body.setAttribute('fill', 'url(#bumbleSkinGrad)');
          }, 2400);

        } else if (hasLemon) {
          // SOUR PUCKER REACTION
          playSlideWhistle('down');
          mouthDefault.style.display = 'none';
          mouthSour.style.display = 'block';
          bContainer.classList.add('anim-sour');
          document.getElementById('speech-bubble').textContent = "SO SOUR! My face is a tiny raisin! 🍋😜";

          setTimeout(() => {
            bContainer.classList.remove('anim-sour');
            mouthSour.style.display = 'none';
            mouthDefault.style.display = 'block';
          }, 2000);

        } else if (hasIce) {
          // FROZEN SNEEZE REACTION
          playSlideWhistle('down');
          body.setAttribute('fill', 'url(#frozenSkinGrad)');
          bContainer.classList.add('anim-frozen');
          document.getElementById('speech-bubble').textContent = "BRRR! Brain freeze! A-CHOO! 🧊❄️";

          setTimeout(() => {
            playBoing();
            bContainer.classList.remove('anim-frozen');
            body.setAttribute('fill', 'url(#bumbleSkinGrad)');
          }, 2200);

        } else if (hasBerries) {
          // BOUNCY BALL REACTION
          playBoing();
          setTimeout(() => playBoing(), 350);
          setTimeout(() => playBoing(), 700);
          bContainer.classList.add('anim-bouncy');
          document.getElementById('speech-bubble').textContent = "BOING BOING! I'm a super bouncy monster! 🍓🏀";

          setTimeout(() => {
            bContainer.classList.remove('anim-bouncy');
          }, 2100);
        }

        // If completed specific order: Fanfare & Hat!
        if (matchedOrder || currentOrder === 0) {
          setTimeout(() => {
            playFanfare();
            triggerConfetti();
            document.getElementById('bumble-chef-hat').style.display = 'block';
            document.getElementById('speech-bubble').textContent = orders[currentOrder].successMsg;

            // Advance order after 3.5s
            if (currentOrder > 0) {
              setTimeout(() => {
                const next = (currentOrder % 3) + 1;
                setOrder(next);
                document.getElementById('bumble-chef-hat').style.display = 'none';
              }, 3400);
            }
          }, 1200);
        }

        // Empty pot after feeding
        clearCauldron();

      }, 550);
    }

    // CONFETTI EFFECT
    function triggerConfetti() {
      const container = document.getElementById('fx-overlay');
      const colors = ['#ef4444', '#f59e0b', '#10b981', '#3b82f6', '#8b5cf6', '#ec4899'];
      for (let i = 0; i < 30; i++) {
        const piece = document.createElement('div');
        piece.className = 'confetti-piece';
        piece.style.left = `${Math.random() * 100}%`;
        piece.style.width = `${8 + Math.random() * 8}px`;
        piece.style.height = `${12 + Math.random() * 10}px`;
        piece.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
        piece.style.borderRadius = '3px';
        piece.style.animationDuration = `${1.8 + Math.random() * 1.2}s`;
        container.appendChild(piece);
        setTimeout(() => piece.remove(), 3000);
      }
    }

    // EYE TRACKING
    window.addEventListener('pointermove', (e) => {
      const pl = document.getElementById('bumble-pupil-left');
      const pr = document.getElementById('bumble-pupil-right');
      const bSvg = document.getElementById('bumble-svg');
      if (!pl || !pr || !bSvg) return;

      const rect = bSvg.getBoundingClientRect();
      const bCenterX = rect.left + rect.width / 2;
      const bCenterY = rect.top + rect.height / 2;

      const dx = e.clientX - bCenterX;
      const dy = e.clientY - bCenterY;
      const dist = Math.hypot(dx, dy) || 1;

      const maxShift = 4;
      const shiftX = (dx / dist) * Math.min(maxShift, Math.abs(dx * 0.05));
      const shiftY = (dy / dist) * Math.min(maxShift, Math.abs(dy * 0.05));

      pl.setAttribute('cx', String(68 + shiftX));
      pl.setAttribute('cy', String(68 + shiftY));
      pr.setAttribute('cx', String(112 + shiftX));
      pr.setAttribute('cy', String(68 + shiftY));
    });

    // PWA Service Worker Registration
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./service-worker.js').catch(() => {});
      });
    }
  </script>
